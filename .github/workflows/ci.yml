# libca CI（Linux + Windows，全模块）
#
# 范围：libca/ 下全部模块（config/core/crypto/csv/env/fs/http/i18n/ini/io/json/log/
# net/opt/process/random/resources/str/test/thread/time/toml/uuid/xml/yaml/zip）。
# 根 xmake.lua 的 with_core 开关现在等价于"编入全部模块"（includes("libca")），
# "core" 只是其中一个普通模块，不再是子库集合，故本文件不再沿用 core-ci 命名。
#
# 平台差异：
# - crypto 在 Windows 走内置后端 + CNG（bcrypt 无条件链接），OpenSSL 变体由
#   openssl job 单独覆盖（linux/windows 各一）；
# - log 的 spdlog 后端（with_spdlog，默认关）由 spdlog job 单独覆盖。
#
# 历史背景：仓库早期存在旧的 libca.core/（带点目录，桌面端 legacy 代码），
# 已于 2026-07 删除，有价值的能力迁移到 libca/str（CharsetConverter）和 libca/ui（Win32 GUI）；
# libca/ui 亦已于 2026-09 整体移除（GUI 能力由独立 uikit 仓库承担）。
#
# 注：暂不含 clang-format job。libca 现有代码尚未按 .clang-format 整体格式化，
# 一次性开启会全红。待全库格式化落地后再加。

name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "libca/**"
      - "xmake.lua"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "libca/**"
      - "xmake.lua"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs (引用门禁 + Sphinx + Doxygen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        # 钉死本地实测通过的版本：-W 下警告集合随 Sphinx 小版本变，范围安装等于定时炸；升级时显式改这一行。
        run: python -m pip install --upgrade "sphinx==9.1.1"

      - name: Reference gate (check_refs)
        run: python doc/check_refs.py .

      # -E：增量缓存会跳过回到旧状态的文件，警告随之消失，等于没门禁。
      - name: "Build design docs (-W: 警告即失败)"
        run: sphinx-build -b html -E -W --keep-going doc doc/_build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: libca-doc-html
          path: doc/_build
          retention-days: 14

      # 微观层：Doxygen 只吃头文件 /// 注释，与 RST 站互不干涉。
      # 版本必须钉死（与本地实测同版）：Doxyfile 的 WARN_* 档随版本增减标签，
      # 老版本会把不认识的标签报成告警，WARN_AS_ERROR 下直接变红。
      - name: Install Doxygen (pinned 1.18.0)
        run: |
          curl -fsSL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz -o /tmp/dox.tar.gz
          mkdir -p "$HOME/doxygen"
          tar xzf /tmp/dox.tar.gz -C "$HOME/doxygen" --strip-components=1
          test -x "$HOME/doxygen/bin/doxygen"
          echo "$HOME/doxygen/bin" >> "$GITHUB_PATH"

      # GITHUB_PATH 的追加不回灌当前步，PATH 自本步起生效；版本打印放这里。
      - name: Build API docs (WARN_AS_ERROR)
        run: |
          doxygen --version
          doxygen doc/Doxyfile

      - name: Upload API site
        uses: actions/upload-artifact@v4
        with:
          name: libca-doc-apidoc
          path: doc/_apidoc/html
          retention-days: 14

  build-and-test-linux:
    name: build & test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # libca 独立构建不依赖 submodule（gtest 走 xrepo）

      - name: Install system deps
        run: |
          # cmake/ninja：xrepo 编译 gtest（cmake-based）需要。
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: libca-xrepo-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libca-xrepo-linux-x64-xmake309-

      - name: Configure (all modules + tests)
        run: |
          # -p linux：显式指定平台，避免歧义。
          # --with_core=y：现等价于编入全部 libca 模块。
          # --with_tests=y：启用 *_unittest target 并拉取 gtest。
          # -y：xrepo 安装 gtest 的交互确认自动通过。
          xmake f -p linux --with_core=y --with_tests=y -y

      - name: Build C++ libraries
        run: xmake build -g libca -v

      - name: Run unit tests
        run: xmake test -g libca/test -v

  build-and-test-http-openssl-linux:
    name: build & test HTTP (linux, OpenSSL 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build perl

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: libca-xrepo-http-openssl3-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libca-xrepo-http-openssl3-linux-x64-xmake309-

      - name: Configure HTTP with OpenSSL 3
        run: |
          xmake f -p linux --with_core=y --with_tests=y --with_openssl=y -y

      - name: Build and test HTTP with OpenSSL 3
        run: |
          xmake build libca_http_unittest
          xmake run libca_http_unittest

  build-and-test-windows:
    name: build & test (windows, ${{ matrix.toolchain }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # msvc 与 mingw-gcc 双前端交叉验证：gcc 能暴露 MSVC 编不到的分支错误
        # （如 POSIX 宏内代码），MSVC 则覆盖 Windows 特有语义。
        toolchain: [msvc, mingw]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # libca 独立构建不依赖 submodule（gtest 走 xrepo）

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: libca-xrepo-windows-${{ matrix.toolchain }}-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libca-xrepo-windows-${{ matrix.toolchain }}-x64-xmake309-

      - name: Configure (all modules + tests, msvc)
        if: matrix.toolchain == 'msvc'
        # -p windows -a x64：走 runner 预装的 MSVC 工具链；cmake/ninja 已预装，gtest 由 xrepo 编译。
        run: xmake f -p windows -a x64 --with_core=y --with_tests=y -y

      - name: Configure (all modules + tests, mingw-gcc)
        if: matrix.toolchain == 'mingw'
        # -p mingw：runner 预装的 MinGW-w64 gcc（PATH 可见），xmake 自动探测。
        run: xmake f -p mingw -a x86_64 --with_core=y --with_tests=y -y

      - name: Build C++ libraries
        run: xmake build -g libca

      - name: Run unit tests
        run: xmake test -g libca/test

  build-and-test-openssl-windows:
    name: build & test OpenSSL (windows, msvc)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          # 与默认 Windows 缓存隔离：含 openssl3 包，体积差异大。
          key: libca-xrepo-windows-openssl3-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libca-xrepo-windows-openssl3-x64-xmake309-

      - name: Configure with OpenSSL 3
        # Windows 上 xrepo 的 openssl3 若无预编译包会源码编译（需 perl/nasm，
        # xmake 自动拉起）；首轮较慢，命中缓存后恢复。
        run: xmake f -p windows -a x64 --with_core=y --with_tests=y --with_openssl=y -y

      - name: Build OpenSSL-variant unittests
        # OpenSSL 变体影响 crypto（EVP 后端）与 http（TLS），两者一并验证。
        run: |
          xmake build libca_crypto_unittest
          xmake build libca_http_unittest

      - name: Run OpenSSL-variant unittests
        run: |
          xmake run libca_crypto_unittest
          xmake run libca_http_unittest

  build-and-test-spdlog-linux:
    name: build & test log (linux, spdlog backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: libca-xrepo-spdlog-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libca-xrepo-spdlog-linux-x64-xmake309-

      - name: Configure log with spdlog backend
        # with_spdlog=y 时 libca_log 追加编译 spdlog 后端源文件，
        # 且 unittest 才包含 spdlog_backend_test.cpp（默认构建会排除）。
        run: |
          xmake f -p linux --with_core=y --with_tests=y --with_spdlog=y -y

      - name: Build and test log with spdlog backend
        run: |
          xmake build libca_log_unittest
          xmake run libca_log_unittest
