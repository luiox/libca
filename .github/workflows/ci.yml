name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    # --- 缓存部分移到安装之前 ---
    - name: Cache xmake packages and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.xmake
          ~/.local/bin/xmake
          ~/.local/bin/xrepo
          build
        key: ${{ runner.os }}-xmake-v3.0.5-${{ hashFiles('**/xmake.lua') }}
        restore-keys: |
          ${{ runner.os }}-xmake-v3.0.5-
          ${{ runner.os }}-xmake-

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: 3.0.5

    - name: Configure xmake
      run: xmake config --toolchain=gcc --ccache=y -y

    - name: Build
      run: xmake build -v

    - name: Run tests
      run: xmake test -g em/test -v
