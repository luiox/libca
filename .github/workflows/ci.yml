name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: 3.0.5
        actions-cache-key: ${{ runner.os }}-xmake-v3.0.5
        package-cache: true
        package-cache-key: ${{ runner.os }}-xmake-packages-${{ hashFiles('**/xmake.lua') }}
        build-cache: true
        build-cache-key: ${{ runner.os }}-xmake-build-${{ hashFiles('**/xmake.lua') }}

    - name: Configure xmake
      run: xmake config --toolchain=gcc --ccache=y -y

    - name: Build
      run: xmake build -v

    - name: Run tests
      run: xmake test -g em/test -v
