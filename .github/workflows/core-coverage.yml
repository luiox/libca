name: Core Coverage

# 仅手动触发（Actions 页面 → Run workflow）。
# 覆盖率收集使用 gcovr：单次调用同时产出 Cobertura XML（供 Codecov）、
# 终端摘要与行覆盖率阈值门禁（>=60%，低于即失败），不再依赖 lcov 工具链版本。
on:
  workflow_dispatch:

concurrency:
  group: core-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build gcovr

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: v3.0.9
        actions-cache-folder: '.xmake-cache'

    - name: Cache xrepo packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.xmake/packages
          ~/.local/share/xmake
        key: libca-xrepo-coverage-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
        restore-keys: |
          libca-xrepo-coverage-linux-x64-xmake309-

    - name: Configure (core coverage mode)
      run: xmake f -m coverage --with_core=y --with_em=n --with_demo=n --with_tests=y -y

    - name: Build core tests
      run: xmake build -g libs

    - name: Run core tests
      run: xmake test -g libs/test

    - name: Collect coverage & threshold gate (lines >= 60%)
      run: |
        gcovr --root . \
          --filter 'libca/' \
          --exclude '.*third_party.*' \
          --print-summary \
          --xml-pretty -o core-coverage.xml \
          --fail-under-line 60

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: core-coverage-report
        path: core-coverage.xml

    - name: Upload core coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./core-coverage.xml
        flags: core
        fail_ci_if_error: false
        verbose: true
