# libca Core CI（Linux，不含 libca.em）
#
# 范围：新 core 子库（libca/{core,str,fs,crypto,time,collection,process,thread,io,net,http}）+ 其 unittest。
# 不编译 libca.em（嵌入式模拟层）。
#
# 历史背景：此前本文件的 path filter 写成 libca.core/**（带点，指老 core 目录），
# 命令也未开 --with_tests，导致新 core（libca/core，morpher 实际引用的）从不在 CI
# 覆盖范围内，size_t 等 Linux 兼容 bug 长期漏网。本次重写：path 覆盖 libca/**、
# 开 with_tests、点名 unittest target，让 CI 真正验证新 core。
#
# 注：暂不含 clang-format job。libca 现有代码尚未按 .clang-format 整体格式化，
# 一次性开启会全红。待全库格式化落地后再加。

name: Core CI

on:
  push:
    branches: ["main"]
    paths:
      - "libca/**"
      - "xmake.lua"
      - ".github/workflows/core-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "libca/**"
      - "xmake.lua"
      - ".github/workflows/core-ci.yml"

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-core:
    name: build & test (linux, no em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # libca 独立构建不依赖 submodule（gtest 走 xrepo）

      - name: Install system deps
        run: |
          # cmake/ninja：xrepo 编译 gtest（cmake-based）需要。
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: libca-xrepo-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libca-xrepo-linux-x64-xmake309-

      - name: Configure (core + tests, no em)
        run: |
          # -p linux：显式指定平台，避免歧义。
          # --with_core=y --with_em=n：只编 core 族，排除 em。
          # --with_tests=y：启用 *_unittest target 并拉取 gtest。
          # --with_demo=n：不编 demo。
          # -y：xrepo 安装 gtest 的交互确认自动通过。
          xmake f -p linux --with_core=y --with_em=n --with_demo=n --with_tests=y -y

      - name: Build new-core targets
        run: |
          # xmake build 一次只接受一个 target，用循环逐个编。
          # 显式点名新 core 子库 + 其 unittest，避免老 libca.core 和 demo 干扰。
          # 若某子库在 Linux 暂未就绪，可先从此列表移除，逐步收敛。
          set -e
          TARGETS=(
            libca_core libca_str libca_fs libca_crypto libca_time libca_collection libca_process
            libca_thread libca_io libca_net libca_http
            libca_core_unittest libca_str_unittest libca_fs_unittest
            libca_crypto_unittest libca_time_unittest libca_collection_unittest
            libca_process_unittest libca_thread_unittest libca_io_unittest libca_net_unittest
            libca_http_unittest
          )
          for t in "${TARGETS[@]}"; do
            echo "::group::xmake build $t"
            xmake build "$t"
            echo "::endgroup::"
          done

      - name: Run unit tests
        run: |
          set -e
          TESTS=(
            libca_core_unittest
            libca_str_unittest
            libca_fs_unittest
            libca_crypto_unittest
            libca_time_unittest
            libca_collection_unittest
            libca_process_unittest
            libca_thread_unittest
            libca_io_unittest
            libca_net_unittest
            libca_http_unittest
          )
          failed=0
          for t in "${TESTS[@]}"; do
            echo "::group::xmake run $t"
            if xmake run "$t"; then
              echo "PASS: $t"
            else
              echo "::error::FAIL: $t"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  build-and-test-http-openssl:
    name: build & test HTTP (linux, OpenSSL 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build perl

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: libca-http-openssl3-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libca-http-openssl3-linux-x64-xmake309-

      - name: Configure HTTP with OpenSSL 3
        run: |
          xmake f -p linux --with_core=y --with_em=n --with_demo=n --with_tests=y --with_openssl=y -y

      - name: Build and test HTTP with OpenSSL 3
        run: |
          xmake build libca_http_unittest
          xmake run libca_http_unittest
