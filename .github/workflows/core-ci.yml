# libca Core CI（Linux，不含 libca.em）
#
# 范围：Linux 可用的 core 子库（libca/{core,str,fs,crypto,time,collection,process,thread,io,net,http}）+ 其 unittest。
# 不编译 libca.em（嵌入式模拟层）和 Windows-only 的 libca/ui。
#
# 历史背景：仓库早期存在旧的 libca.core/（带点目录，桌面端 legacy 代码），
# 已于 2026-07 删除，有价值的能力迁移到 libca/str（CharsetConverter）和 libca/ui（Win32 GUI）。
# 本 CI 现在只覆盖新 libca/，path filter 已指向 libca/**。
#
# 注：暂不含 clang-format job。libca 现有代码尚未按 .clang-format 整体格式化，
# 一次性开启会全红。待全库格式化落地后再加。

name: Core CI

on:
  push:
    branches: ["main"]
    paths:
      - "libca/**"
      - "xmake.lua"
      - ".github/workflows/core-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "libca/**"
      - "xmake.lua"
      - ".github/workflows/core-ci.yml"

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-core:
    name: build & test (linux, no em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # libca 独立构建不依赖 submodule（gtest 走 xrepo）

      - name: Install system deps
        run: |
          # cmake/ninja：xrepo 编译 gtest（cmake-based）需要。
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: libca-xrepo-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libca-xrepo-linux-x64-xmake309-

      - name: Configure (core + tests, no em)
        run: |
          # -p linux：显式指定平台，避免歧义。
          # --with_core=y --with_em=n：只编 core 族，排除 em。
          # --with_tests=y：启用 *_unittest target 并拉取 gtest。
          # --with_demo=n：不编 demo。
          # -y：xrepo 安装 gtest 的交互确认自动通过。
          xmake f -p linux --with_core=y --with_em=n --with_demo=n --with_tests=y -y

      - name: Build C++ libraries
        run: xmake build -g libs -v

      - name: Run unit tests
        run: xmake test -g libs/test -v

  build-and-test-http-openssl:
    name: build & test HTTP (linux, OpenSSL 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build perl

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: libca-http-openssl3-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            libca-http-openssl3-linux-x64-xmake309-

      - name: Configure HTTP with OpenSSL 3
        run: |
          xmake f -p linux --with_core=y --with_em=n --with_demo=n --with_tests=y --with_openssl=y -y

      - name: Build and test HTTP with OpenSSL 3
        run: |
          xmake build libca_http_unittest
          xmake run libca_http_unittest
