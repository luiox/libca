name: Core CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "libca.core/**"
      - "xmake.lua"
      - "libca.core/xmake.lua"
      - ".github/workflows/core-ci.yml"
      - ".github/workflows/core-coverage.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "libca.core/**"
      - "xmake.lua"
      - "libca.core/xmake.lua"
      - ".github/workflows/core-ci.yml"
      - ".github/workflows/core-coverage.yml"

jobs:
  build-and-test-core:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: 3.0.5
        actions-cache-folder: '.xmake-cache'

    - name: Configure core-only build
      run: xmake f --toolchain=gcc --ccache=y --with_core=y --with_em=n --with_demo=n -y

    - name: Build core tests
      run: xmake build test-libca.log -v

    - name: Run core tests
      run: xmake test -g core/test -v
