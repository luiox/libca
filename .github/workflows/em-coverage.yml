name: EM Coverage

on:
  push:
    branches: [ "main" ]
    paths:
      - "libca.em/**"
      - "xmake.lua"
      - "xmake/**"
      - "libca.em/xmake.lua"
      - ".github/workflows/em-coverage.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "libca.em/**"
      - "xmake.lua"
      - "xmake/**"
      - "libca.em/xmake.lua"
      - ".github/workflows/em-coverage.yml"

concurrency:
  group: em-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-em:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build gcovr

    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        # 与 core-ci/core-coverage 统一 xmake 版本。
        xmake-version: v3.0.9
        actions-cache-folder: '.xmake-cache'

    - name: Configure (em coverage mode)
      run: xmake f -m coverage --with_core=n --with_em=y --with_demo=n -y

    - name: Build em tests
      run: xmake build

    - name: Run em tests
      run: xmake test -g em/test

    - name: Collect coverage & threshold gate (lines >= 60%)
      # gcovr 单次调用：Cobertura XML（供 Codecov）+ 终端摘要 + 行覆盖率阈值门禁。
      # 只统计 libca.em/src（排除测试与移植桩代码）。
      run: |
        gcovr --root . \
          --filter 'libca.em/src/' \
          --print-summary \
          --xml-pretty -o em-coverage.xml \
          --fail-under-line 60

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: em-coverage-report
        path: em-coverage.xml

    - name: Upload em coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./em-coverage.xml
        flags: em
        fail_ci_if_error: false
        verbose: true
